<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración de metadatos y Bootstrap -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Querido Diario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Barra de navegación principal -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/dashboard">QueridoDiario</a>
            {% if session.usuario_id %}
            <div>
                <a href="/dashboard" class="text-decoration-none me-3">Inicio</a>
                <a href="/logout" class="text-decoration-none text-danger">Cerrar Sesión</a>
            </div>
            {% endif %}
        </div>
    </nav>
    <!-- Contenedor dinámico para las vistas -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
