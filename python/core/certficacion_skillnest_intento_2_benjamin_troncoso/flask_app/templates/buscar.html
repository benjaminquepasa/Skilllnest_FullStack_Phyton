{% extends 'base.html' %}
{% block content %}
<!-- Título con el término buscado -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3>Resultados para: "{{ termino }}"</h3>
    <div>
        <a href="/dashboard" class="text-decoration-none me-3">Inicio</a>
        <a href="/logout" class="text-decoration-none text-danger">Cerrar Sesión</a>
    </div>
</div>

<!-- Resultados de búsqueda -->
<div class="row">
    {% for entrada in entradas %}
    <div class="col-md-4 mb-3">
        <div class="card p-3 shadow-sm bg-white">
            <h5>Entrada</h5>
            <p class="text-muted">{{ entrada.fecha_entrada }}</p>
            <div class="d-flex justify-content-between">
                <a href="/editor/{{ entrada.id }}" class="btn btn-sm btn-outline-dark">Editar</a>
                <a href="/borrar/{{ entrada.id }}" class="btn btn-sm btn-outline-danger">Borrar</a>
                <a href="/ver/{{ entrada.id }}" class="btn btn-sm btn-outline-primary">Ver</a>
            </div>
        </div>
    </div>
    {% else %}
    <p>No se encontraron entradas con ese término.</p>
    {% endfor %}
</div>
{% endblock %}
