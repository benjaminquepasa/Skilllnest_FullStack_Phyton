{% extends 'base.html' %}
{% block content %}
<div class="row">
    <div class="col-md-6">
        <h3 class="mb-3">Registro</h3>
        {% for mensaje in get_flashed_messages(category_filter=['registro']) %}
            <div class="alert alert-danger p-2">{{ mensaje }}</div>
        {% endfor %}
        <form action="/registro" method="POST" class="p-4 bg-white shadow rounded">
            <div class="mb-2"><label>Nombre</label><input type="text" name="nombre" class="form-control"></div>
            <div class="mb-2"><label>Apellido</label><input type="text" name="apellido" class="form-control"></div>
            <div class="mb-2"><label>E-mail</label><input type="email" name="email" class="form-control"></div>
            <div class="mb-2"><label>Edad</label><input type="number" name="edad" class="form-control"></div>
            <div class="mb-2"><label>Contraseña</label><input type="password" name="password" class="form-control"></div>
            <div class="mb-3"><label>Conf. Contraseña</label><input type="password" name="conf_password" class="form-control"></div>
            <button type="submit" class="btn btn-secondary w-100">Registrar</button>
        </form>
    </div>
    <div class="col-md-6">
        <h3 class="mb-3">Inicio de Sesión</h3>
        {% for mensaje in get_flashed_messages(category_filter=['login']) %}
            <div class="alert alert-danger p-2">{{ mensaje }}</div>
        {% endfor %}
        <form action="/login" method="POST" class="p-4 bg-white shadow rounded">
            <div class="mb-2"><label>E-mail</label><input type="email" name="email" class="form-control"></div>
            <div class="mb-3"><label>Contraseña</label><input type="password" name="password" class="form-control"></div>
            <button type="submit" class="btn btn-secondary w-100">Iniciar Sesión</button>
        </form>
    </div>
</div>
{% endblock %}
