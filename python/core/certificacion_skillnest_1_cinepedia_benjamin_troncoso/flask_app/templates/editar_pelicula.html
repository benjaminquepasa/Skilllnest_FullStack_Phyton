<!-- ========================================== -->
<!-- SECCIÓN: HERENCIA DE PLANTILLA Y BLOQUE DE CONTENIDO -->
<!-- ========================================== -->
{% extends "base.html" %}
{% block content %}

<!-- ========================================== -->
<!-- SECCIÓN: CABECERA Y BOTONES DE NAVEGACIÓN -->
<!-- ========================================== -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Editar Película</h2>
    <div>
        <a href="/cine" class="btn btn-outline-secondary me-2">Inicio</a>
        <a href="/logout" class="btn btn-outline-danger">Cerrar Sesión</a>
    </div>
</div>

<!-- ========================================== -->
<!-- SECCIÓN: MENSAJES FLASH DE ERROR (VALIDACIONES) -->
<!-- ========================================== -->
{% with messages = get_flashed_messages(category_filter=['pelicula']) %}
    {% if messages %}
        <div class="alert alert-danger">
            {% for message in messages %}
                <p class="mb-0">{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}

<!-- ========================================== -->
<!-- SECCIÓN: FORMULARIO DE EDICIÓN DE PELÍCULA -->
<!-- ========================================== -->
<form action="/cine/actualizar/{{ pelicula.id }}" method="POST" class="w-50">
    <div class="mb-3">
        <label>Nombre de Peli:</label>
        <input type="text" name="nombre_peli" class="form-control" value="{{ pelicula.nombre_peli }}">
    </div>
    <div class="mb-3">
        <label>Director:</label>
        <input type="text" name="director" class="form-control" value="{{ pelicula.director }}">
    </div>
    <div class="mb-3">
        <label>Fecha Estreno:</label>
        <input type="date" name="fecha_estreno" class="form-control" value="{{ pelicula.fecha_estreno }}">
    </div>
    <div class="mb-3">
        <label>Sinopsis:</label>
        <textarea name="sinopsis" class="form-control" rows="4">{{ pelicula.sinopsis }}</textarea>
    </div>
    <button type="submit" class="btn btn-warning">Actualizar Película</button>
</form>
{% endblock %}
