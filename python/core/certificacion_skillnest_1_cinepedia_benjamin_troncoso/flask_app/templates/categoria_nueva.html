{% extends "base.html" %}
{% block body %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3>Nueva Categoría</h3>
        
        <!-- Mensajes de error flash -->
        {% with messages = get_flashed_messages(category_filter=['category']) %}
            {% if messages %}
                <div class="alert alert-danger">
                    {% for message in messages %}
                        <p class="mb-0">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="/categorias/crear" method="POST">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" id="nombre" name="nombre" class="form-control" required autocomplete="off">
            </div>
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="/categorias" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
