{% extends "base.html" %}
{% block body %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h3>Editar Tarea</h3>
        {% with messages = get_flashed_messages(category_filter=['task']) %}
            {% if messages %}
                <div class="alert alert-danger">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <form action="/tareas/actualizar/{{ tarea.id }}" method="POST">
            <div class="mb-3">
                <label>Título:</label>
                <input type="text" name="titulo" value="{{ tarea.titulo }}" class="form-control">
            </div>
            <div class="mb-3">
                <label>Categoría:</label>
                <select name="category_id" class="form-select">
                    {% for cat in categorias %}
                    <option value="{{ cat.id }}" {% if cat.id == tarea.category_id %}selected{% endif %}>{{ cat.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label>Prioridad:</label>
                <select name="prioridad" class="form-select">
                    <option value="Alta" {% if tarea.prioridad == 'Alta' %}selected{% endif %}>Alta</option>
                    <option value="Media" {% if tarea.prioridad == 'Media' %}selected{% endif %}>Media</option>
                    <option value="Baja" {% if tarea.prioridad == 'Baja' %}selected{% endif %}>Baja</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Estado:</label>
                <select name="estado" class="form-select">
                    <option value="Pendiente" {% if tarea.estado == 'Pendiente' %}selected{% endif %}>Pendiente</option>
                    <option value="En progreso" {% if tarea.estado == 'En progreso' %}selected{% endif %}>En progreso</option>
                    <option value="Completada" {% if tarea.estado == 'Completada' %}selected{% endif %}>Completada</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Fecha límite:</label>
                <input type="date" name="fecha_limite" value="{{ tarea.fecha_limite }}" class="form-control">
            </div>
            <div class="mb-3">
                <label>Descripción:</label>
                <textarea name="descripcion" class="form-control" rows="4">{{ tarea.descripcion }}</textarea>
            </div>
            <button type="submit" class="btn btn-dark">Actualizar</button>
            <a href="/tareas" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
