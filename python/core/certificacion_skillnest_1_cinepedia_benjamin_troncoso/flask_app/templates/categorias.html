{% extends "base.html" %}
{% block body %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Categorías</h2>
    <a href="/categorias/nueva" class="btn btn-primary">+ Nueva Categoría</a>
</div>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Cantidad de tareas</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for cat in categorias %}
        <tr>
            <td>{{ cat.nombre }}</td>
            <td>{{ cat.cantidad_tareas }}</td>
            <td>
                <a href="/categorias/borrar/{{ cat.id }}" class="btn btn-sm btn-danger" onclick="return confirm('¿Seguro que deseas borrar esta categoría?')">Borrar</a>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="3" class="text-center">No hay categorías registradas.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<a href="/tareas" class="btn btn-secondary">Volver a Mis Tareas</a>
{% endblock %}
