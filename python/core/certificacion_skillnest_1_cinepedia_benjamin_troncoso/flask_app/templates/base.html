<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePedia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- ========================================== -->
    <!-- SECCIÓN: BARRA DE NAVEGACIÓN -->
    <!-- ========================================== -->
    <nav class="navbar navbar-dark bg-dark px-4 shadow-sm">
        <a class="navbar-brand fw-bold fs-4 text-white text-decoration-none" href="/cine">CinePedia</a>
    </nav>

    <!-- ========================================== -->
    <!-- SECCIÓN: CONTENEDOR PRINCIPAL (BLOQUE JINJA2) -->
    <!-- ========================================== -->
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- ========================================== -->
    <!-- SECCIÓN: SCRIPTS Y DEPENDENCIAS JS -->
    <!-- ========================================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
