<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="top-nav">
    <button class="theme-toggle" id="themeBtn" title="Cambiar Tema">
      <i class="fa-solid fa-sun" id="themeIcon"></i>
    </button>
    <button class="exit-btn">Salir</button>
  </header>

  <main class="container">
    
    <div class="header-title">
      <h1>🔴 Pokédex</h1>
      <p>Mostrando {{ pokemones|length }} Pokémon</p>
    </div>

    <div class="filter-buttons">
      <a href="/pokemon" class="btn btn-blue">
        <i class="fa-solid fa-list-check"></i> Ver todos
      </a>
      <a href="/pokemon/cantidad/5" class="btn btn-green">
        <i class="fa-solid fa-filter"></i> Ver 5 primeros
      </a>
    </div>

    <div class="pokemon-grid">
      {% for p in pokemones %}
        <article class="card">
          
          <div class="card-header">
            <span class="badge-id">#{{ p.id }}</span>
            <img src="{{ url_for('static', filename='img/' + p.imagen) }}" alt="{{ p.nombre }}">
          </div>

          <div class="card-body">
            <h3>{{ p.nombre }}</h3>
            
            <div class="types">
              <span class="type">{{ p.tipo }}</span>
            </div>

            <div class="stat-bar-container">
              <div class="stat-label"><i class="fa-solid fa-bolt"></i> Poder: {{ p.poder }}</div>
              <div class="progress-bar">
                <div class="progress"
              </div>
            </div>

            <div class="details-row">
              <div><small>📏 Altura</small> <strong>{{ p.altura }}</strong></div>
              <div><small>⚖️ Peso</small> <strong>{{ p.peso }}</strong></div>
            </div>

            <button class="btn-details">Ver detalles</button>
          </div>

        </article>
      {% endfor %}
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
