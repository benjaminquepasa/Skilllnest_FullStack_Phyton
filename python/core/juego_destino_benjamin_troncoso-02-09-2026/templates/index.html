<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Juego del Destino</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Fondo decorativo estrellado -->
    <div class="stars-bg"></div>

    <div class="main-wrapper">
        <div class="card-container">
            <!-- Header con icono de luna -->
            <div class="header-section">
                <div class="icon-circle moon-icon">
                    <i class="fa-solid fa-moon"></i>
                </div>
                <h1 class="main-title">El Juego del Destino</h1>
                <p class="subtitle">Descubre qué te depara el futuro</p>
            </div>

            <!-- Formulario de entrada -->
            <form action="{{ url_for('enviar') }}" method="POST" class="form-body">
                
                <!-- Campo Nombre -->
                <div class="field-container">
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user field-icon"></i>
                        <input type="text" name="nombre" placeholder="Tu nombre" required>
                    </div>
                </div>

                <!-- Campo Edad -->
                <div class="field-container">
                    <div class="input-wrapper">
                        <i class="fa-solid fa-calendar-days field-icon"></i>
                        <input type="number" name="edad" placeholder="Tu edad" min="1" max="120" required>
                    </div>
                </div>

                <!-- Campo Color Favorito -->
                <div class="field-container">
                    <div class="input-wrapper">
                        <i class="fa-solid fa-palette field-icon"></i>
                        <input type="text" name="color" placeholder="Tu color favorito" required>
                    </div>
                    <span class="field-hint">Ej. rojo, azul, verde, morado, amarillo...</span>
                </div>

                <!-- Campo Animal Favorito -->
                <div class="field-container">
                    <div class="input-wrapper">
                        <i class="fa-solid fa-paw field-icon"></i>
                        <input type="text" name="animal" placeholder="Tu animal favorito" required>
                    </div>
                    <span class="field-hint">Ej. perro, gato, águila, león, delfín...</span>
                </div>

                <!-- Bola de Cristal Decorativa -->
                <div class="orb-container">
                    <div class="crystal-orb"></div>
                </div>

                <!-- Botón para enviar -->
                <button type="submit" class="submit-btn">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Revelar mi destino
                </button>
            </form>
        </div>
    </div>
</body>
</html>
