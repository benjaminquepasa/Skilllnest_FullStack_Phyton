<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BookHub - Nuevo Libro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Agregar Nuevo Libro</h2>
    {% with messages = get_flashed_messages(category_filter=['book']) %}
        {% if messages %}
            {% for message in messages %}
                <p class="text-danger">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form action="/libros/crear" method="POST" class="w-50">
        <div class="mb-2"><label>Título:</label><input type="text" name="title" class="form-control"></div>
        <div class="mb-2"><label>Autor:</label><input type="text" name="author" class="form-control"></div>
        <div class="mb-2">
            <label>Género:</label>
            <select name="genre" class="form-control">
                <option value="">Selecciona un género</option>
                <option value="Novela">Novela</option>
                <option value="Fábula">Fábula</option>
                <option value="Ciencia Ficción">Ciencia Ficción</option>
                <option value="Romance">Romance</option>
                <option value="Desarrollo Personal">Desarrollo Personal</option>
            </select>
        </div>
        <div class="mb-2"><label>Fecha de publicación:</label><input type="date" name="publication_date" class="form-control"></div>
        <div class="mb-2"><label>Descripción:</label><textarea name="description" class="form-control"></textarea></div>
        <button type="submit" class="btn btn-dark">Guardar</button>
        <a href="/libros" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
