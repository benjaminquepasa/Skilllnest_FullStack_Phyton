<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BookHub - Editar Libro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Editar Libro</h2>
    {% with messages = get_flashed_messages(category_filter=['book']) %}
        {% if messages %}
            {% for message in messages %}
                <p class="text-danger">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form action="/libros/actualizar/{{ book.id }}" method="POST" class="w-50">
        <div class="mb-2"><label>Título:</label><input type="text" name="title" value="{{ book.title }}" class="form-control"></div>
        <div class="mb-2"><label>Autor:</label><input type="text" name="author" value="{{ book.author }}" class="form-control"></div>
        <div class="mb-2">
            <label>Género:</label>
            <select name="genre" class="form-control">
                <option value="Novela" {% if book.genre == 'Novela' %}selected{% endif %}>Novela</option>
                <option value="Ciencia Ficción" {% if book.genre == 'Ciencia Ficción' %}selected{% endif %}>Ciencia Ficción</option>
                <option value="Romance" {% if book.genre == 'Romance' %}selected{% endif %}>Romance</option>
                <option value="Desarrollo Personal" {% if book.genre == 'Desarrollo Personal' %}selected{% endif %}>Desarrollo Personal</option>
            </select>
        </div>
        <div class="mb-2"><label>Fecha de publicación:</label><input type="date" name="publication_date" value="{{ book.publication_date }}" class="form-control"></div>
        <div class="mb-2"><label>Descripción:</label><textarea name="description" class="form-control">{{ book.description }}</textarea></div>
        <button type="submit" class="btn btn-dark">Actualizar</button>
        <a href="/libros" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
