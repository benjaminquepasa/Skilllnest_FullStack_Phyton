<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BookHub - Editar Libro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 py-3 mb-4 shadow-sm">
        <a class="navbar-brand d-flex align-items-center text-white text-decoration-none" href="/libros">
            <i class="bi bi-book-half fs-3 me-2"></i>
            <span class="fs-4 fw-bold">BookHub</span>
        </a>
        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav me-auto ms-4">
                <li class="nav-item"><a class="nav-link" href="/libros">Mis Libros</a></li>
                <li class="nav-item"><a class="nav-link" href="/explorar">Explorar</a></li>
                <li class="nav-item"><a class="nav-link" href="/favoritos">Mis Favoritos</a></li>
            </ul>
            <div class="d-flex align-items-center text-white">
                <span class="me-3">Bienvenido, {{ session['first_name'] }}</span>
                <a href="/logout" class="btn btn-outline-light btn-sm">Salir</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="fw-bold mb-3">Editar Libro</h2>
        {% with messages = get_flashed_messages(category_filter=['book']) %}
            {% if messages %}
                {% for message in messages %}
                    <p class="text-danger small">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form action="/libros/actualizar/{{ book.id }}" method="POST" class="w-50 bg-white p-4 shadow-sm rounded">
            <div class="mb-3"><label class="form-label">Título:</label><input type="text" name="title" value="{{ book.title }}" class="form-control"></div>
            <div class="mb-3"><label class="form-label">Autor:</label><input type="text" name="author" value="{{ book.author }}" class="form-control"></div>
            <div class="mb-3">
                <label class="form-label">Género:</label>
                <select name="genre" class="form-control">
                    <option value="Novela" {% if book.genre == 'Novela' %}selected{% endif %}>Novela</option>
                    <option value="Fábula" {% if book.genre == 'Fábula' %}selected{% endif %}>Fábula</option>
                    <option value="Ciencia Ficción" {% if book.genre == 'Ciencia Ficción' %}selected{% endif %}>Ciencia Ficción</option>
                    <option value="Romance" {% if book.genre == 'Romance' %}selected{% endif %}>Romance</option>
                    <option value="Desarrollo Personal" {% if book.genre == 'Desarrollo Personal' %}selected{% endif %}>Desarrollo Personal</option>
                </select>
            </div>
            <div class="mb-3"><label class="form-label">Fecha de publicación:</label><input type="date" name="publication_date" value="{{ book.publication_date }}" class="form-control"></div>
            <div class="mb-3"><label class="form-label">Descripción:</label><textarea name="description" class="form-control" rows="4">{{ book.description }}</textarea></div>
            <button type="submit" class="btn btn-dark">Actualizar</button>
            <a href="/libros" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
